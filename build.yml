cd /workspaces/VMPLift

cat << 'EOF' > .github/workflows/build.yml
name: MinGW Windows Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install vcpkg dependencies
      run: |
        vcpkg install capstone:x64-windows
        vcpkg install unicorn:x64-windows

    - name: Compile VMPLift with MinGW
      run: |
        g++ *.cpp -o VMPLift.exe -I"C:/vcpkg/installed/x64-windows/include" -L"C:/vcpkg/installed/x64-windows/lib" -lcapstone -lunicorn -DWindows_h=windows_h -include windows.h -static -static-libgcc -static-libstdc++

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VMPLift-Windows-x64
        path: |
          VMPLift.exe
          C:/vcpkg/installed/x64-windows/bin/capstone.dll
          C:/vcpkg/installed/x64-windows/bin/unicorn.dll
EOF

# Pousser les modifications sur votre dépôt GitHub
git add .github/workflows/build.yml
git commit -m "Correction des drapeaux d'édition de liens -L et -l pour MinGW"
git push origin main
