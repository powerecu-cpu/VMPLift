name: MinGW Windows Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install vcpkg dependencies
      run: |
        vcpkg install capstone:x64-windows
        vcpkg install unicorn:x64-windows

    - name: Compile VMPLift with MinGW
      run: |
        g++ *.cpp -o VMPLift.exe -I. -I"C:/vcpkg/installed/x64-windows/include" "C:/vcpkg/installed/x64-windows/lib/capstone.lib" "C:/vcpkg/installed/x64-windows/lib/unicorn.lib" -DWindows_h=windows_h -include windows.h -static-libgcc -static-libstdc++

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VMPLift-Windows-x64
        path: |
          VMPLift.exe
          C:/vcpkg/installed/x64-windows/bin/capstone.dll
          C:/vcpkg/installed/x64-windows/bin/unicorn.dll
